[toolchain]
anchor_version = "1.1.2"
solana_version = "3.1.10"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
arancio = "FwYP85cYksB7gHWe67CEUcYEFokikEUYGmf9ZGt8Qqgf"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[surfpool]
startup_wait = 30000
shutdown_wait = 2000
rpc_port = 8899
ws_port = 8900
host = "127.0.0.1"
online = false

[scripts]
test = "yarn ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]
